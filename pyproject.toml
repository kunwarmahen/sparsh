[project]
name = "sparsh"
version = "0.1.0"
description = "sparsh -- an agent's hands on a real phone: see the screen as a numbered list, tap, type, scroll"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
# No dependencies, on purpose: Sparsh talks to the phone through `adb`,
# the program Android's own tools install, and reads what it prints.
dependencies = []

[project.scripts]
sparsh = "sparsh.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sparsh"]

[tool.ruff]
line-length = 100          # prose wraps near 79; this is the HARD ceiling
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
